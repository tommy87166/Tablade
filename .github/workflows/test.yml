name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Rust（解 zip 裡的 Deflate64 的模組，native/）
        run: rustup toolchain install 1.100.0 --profile minimal && rustup default 1.100.0
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            native/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/Cargo.lock') }}
      - run: uv sync --frozen --group native
      - name: 前端（lint、型別檢查、build、測試）
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npm test

      - name: 資料防護檢查
        run: uv run python scripts/check_no_data.py --all
      - name: 程式規則檢查（禁止網路與 eval/exec）
        run: uv run python scripts/check_code_policy.py src
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: pytest
        run: uv run pytest
