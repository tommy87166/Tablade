name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Rust（解 zip 裡的 Deflate64 的模組，native/）
        run: rustup toolchain install 1.100.0 --profile minimal && rustup default 1.100.0
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            native/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/Cargo.lock') }}
      - run: uv sync --frozen --group native

      - name: 發版前檢查：tag 要和程式版號一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv run python scripts/check_release.py "${{ github.ref_name }}"

      # Windows 只打包 onefile，macOS 只打包 Tablade.app（見 scripts/build.py 的 release_modes）
      - name: 打包、自我檢測、壓縮
        run: uv run python scripts/build.py --gui-smoke

      - uses: actions/upload-artifact@v7
        with:
          name: tablade-${{ runner.os }}
          path: dist/release/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen
      - name: 發版前檢查：tag 要和程式版號一致
        run: uv run python scripts/check_release.py "${{ github.ref_name }}"
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - name: 產生 AI skill（tablade-recipe-skill-v<recipe 版本>.zip）
        working-directory: release
        run: uv run --project .. tablade skill
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*.zip
          generate_release_notes: true
