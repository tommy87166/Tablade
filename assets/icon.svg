<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tablade">
  <!-- Tablade 圖示：表格＋菜刀。修改後執行 scripts/make_icons.py 重新產生 icon.ico / icon.icns -->
  <defs>
    <clipPath id="tablade-table"><rect x="8" y="28" width="34" height="28" rx="4"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0e7c5b"/>

  <!-- 表格：淺色標題列＋3×3 格線 -->
  <g clip-path="url(#tablade-table)">
    <rect x="8" y="28" width="34" height="28" fill="#ffffff"/>
    <rect x="8" y="28" width="34" height="7.5" fill="#c9eee0"/>
    <g fill="#0e7c5b">
      <rect x="8" y="34.5" width="34" height="2"/>
      <rect x="8" y="41.5" width="34" height="1.6"/>
      <rect x="8" y="48.4" width="34" height="1.6"/>
      <rect x="18.5" y="35.5" width="1.6" height="21"/>
      <rect x="29.9" y="35.5" width="1.6" height="21"/>
    </g>
  </g>

  <!-- 菜刀：刀柄、刀身、刃口亮線、刀身開孔；斜切進表格右上角 -->
  <g transform="translate(38 22) rotate(-38) scale(0.92)">
    <rect x="11" y="-9.2" width="15.5" height="6.6" rx="3.3" fill="#083d2d" stroke="#0e7c5b" stroke-width="2"/>
    <path d="M-13 -8Q-13 -9.5-11.5-9.5H13V7Q13 9.5 10 9.5H-10.5Q-13 9.5-13 7Z" fill="#ffffff" stroke="#0e7c5b" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M-12 6.6H12" stroke="#a9d9c7" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="-8.3" cy="-5" r="1.9" fill="#0e7c5b"/>
  </g>
</svg>
