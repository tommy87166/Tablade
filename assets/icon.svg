<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tablade">
  <!-- Tablade 圖示：置中的表格＋🔪。修改後執行 scripts/make_icons.py 重新產生 icon.ico / icon.icns / icon.png -->
  <defs>
    <clipPath id="tablade-table"><rect x="12" y="28" width="40" height="25" rx="4"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#fd5108"/>

  <!-- 表格：淺色標題列＋3×3 格線 -->
  <g clip-path="url(#tablade-table)">
    <rect x="12" y="28" width="40" height="25" fill="#ffffff"/>
    <rect x="12" y="28" width="40" height="7.5" fill="#ffe0d1"/>
    <g fill="#fd5108">
      <rect x="12" y="34.5" width="40" height="2"/>
      <rect x="12" y="40.5" width="40" height="1.6"/>
      <rect x="12" y="46.4" width="40" height="1.6"/>
      <rect x="24.5" y="35.5" width="1.6" height="18"/>
      <rect x="37.9" y="35.5" width="1.6" height="18"/>
    </g>
  </g>

  <!-- 🔪：刀尖朝左、刀柄在右，橫切過表格上緣 -->
  <g transform="translate(31.5 20) rotate(-14) scale(1.05)">
    <path d="M1 -5.5H-13Q-20 -5-25 3.2Q-13 5.5 1 5.5Z" fill="#ffffff" stroke="#fd5108" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M-17 3.6Q-8 4-1 3.9" fill="none" stroke="#ffc4a8" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="1" y="-4.6" width="18" height="9.2" rx="3.6" fill="#3a1405" stroke="#fd5108" stroke-width="2"/>
    <circle cx="7" cy="0" r="1.3" fill="#ffe0d1"/>
    <circle cx="13.5" cy="0" r="1.3" fill="#ffe0d1"/>
  </g>
</svg>
